name: SessionAccountApp
options:
  bundleIdPrefix: com.cartridge
  deploymentTarget:
    iOS: "17.0"
  
targets:
  SessionAccountApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "*.sh"
          - "*.md"
          - "project.yml"
      - path: ../../../bindings/swift/controller_uniffi.swift
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cartridge.sessionaccount
      SWIFT_OBJC_BRIDGING_HEADER: SessionAccountApp-Bridging-Header.h
      LIBRARY_SEARCH_PATHS: 
        - "$(inherited)"
        - "$(PROJECT_DIR)/../../../target/release"
      RUNPATH_SEARCH_PATHS:
        - "$(inherited)"
        - "@executable_path/Frameworks"
        - "$(PROJECT_DIR)/../../../target/release"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      ENABLE_BITCODE: NO
    dependencies:
      - framework: ../../../target/release/libcontroller_uniffi.dylib
        embed: true


