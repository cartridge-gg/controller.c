[package]
edition = "2021"
name = "controller-uniffi"
version = "0.1.0"
authors = ["Cartridge"]
description = "UniFFI bindings for the Controller SDK"
license = "MIT"

[workspace]
# This is a standalone package, not part of a workspace

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
account_sdk = { git = "https://github.com/cartridge-gg/controller-rs", rev = "c189f64" }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
starknet = "0.17.0-rc.4"
starknet-crypto = { version = "0.8.0", features = ["pedersen_no_lookup"] }
starknet-types-core = { version = "0.2.0", features = ["curve", "hash"] }
starknet-signers = "0.14"
async-trait = "0.1"
lazy_static = "1.5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2"

# UniFFI
uniffi = { version = "0.30", features = ["bindgen", "cli"] }
uniffi_bindgen = "0.30"
camino = "1.2"
which = "7.0"
walkdir = "2.5"
cargo_metadata = "0.19"

[build-dependencies]
uniffi = { version = "0.30", features = ["build"] }

[dev-dependencies]
uniffi = { version = "0.30", features = ["bindgen-tests"] }

# UniFFI bindgen binaries
[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

[[bin]]
name = "uniffi-bindgen-kotlin"
path = "src/bin/uniffi-bindgen-kotlin.rs"

[[bin]]
name = "uniffi-bindgen-python"
path = "src/bin/uniffi-bindgen-python.rs"

[[bin]]
name = "uniffi-bindgen-cpp"
path = "src/bin/uniffi-bindgen-cpp.rs"

[[bin]]
name = "uniffi-bindgen-csharp"
path = "src/bin/uniffi-bindgen-csharp.rs"

[[bin]]
name = "uniffi-bindgen-go"
path = "src/bin/uniffi-bindgen-go.rs"

[[bin]]
name = "uniffi-bindgen-react-native"
path = "src/bin/uniffi-bindgen-react-native.rs"

[features]
default = []
