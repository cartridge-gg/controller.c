[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "nanobind>=2.0.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "controller_c"
version = "0.1.0"
description = "Python bindings for Controller SDK"
requires-python = ">=3.8"
dependencies = [
    "nanobind>=2.0.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.verbose = true
wheel.expand-macos-universal-tags = true

[tool.scikit-build.cmake.define]
CMAKE_OSX_DEPLOYMENT_TARGET = "10.14"
